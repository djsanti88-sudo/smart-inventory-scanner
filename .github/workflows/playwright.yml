name: Playwright E2E

# Runs the mock-backend Playwright proof suite (the same one `npm run test:e2e` runs locally)
# on every push and PR. TEST SAFETY: the webServer sets IS_E2E=1, which forces /api/ai-lookup
# mock-only, so CI never calls a live AI provider (see CLAUDE.md + playwright.config.ts).
# Firebase, human-bot, and live suites are intentionally NOT run here - they need emulators /
# real backends / owner-gated live keys and stay local. This job is the fast correctness gate.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Mock E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard step timeout (owner 2026-08-19): a stalled browser download fails fast and visibly
      # instead of burning the whole job budget; re-run the job when the CDN recovers.
      - name: Install Playwright Chromium + OS deps
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      # The one unit-level test that needs a real browser (report PDF rendering) lives here, next to
      # the only job that installs one; the unit-tests job stays browser-free.
      - name: Browser-backed report render test
        run: npx vitest run scripts/__tests__/render-report-pdf.test.mjs

      - name: Run Playwright E2E (mock backend)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
